<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="main">
    <img class="logo" src="./assets/images/logo.png" alt="logo">
    <h1>We are <span>Adorable</span> Babies</h1>
    <div class="left card"><img class="tile-image" src="./assets/images/sadbaby.png" alt="hand and flower in water">
      <h2 class="card-title">Sad</h2>
      <p class="card-text">Many things can make us sad but we're still look adorable. </p>
    </div>

    <div class="right card"><img class="tile-image" src="./assets/images/cryingbaby.png" alt="metal structure">
      <h2 class="card-title">Crying</h2>
      <p>Even we're crying because of starving or thrist, we're still look adorable</p>
    </div>

  </div>
  <footer>
    <p>Create. Develop. Design.</p>
  </footer>
</body>

</html>
